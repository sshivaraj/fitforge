<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Figure gallery</title><link rel="stylesheet" href="styles.css">
<style>body{padding:16px}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}.g div{background:var(--surface);border-radius:12px;padding:8px;font-size:11px}</style></head>
<body><div class="g" id="g"></div><script src="data.js"></script><script src="figures.js"></script>
<script>const still=location.hash==="#still";document.getElementById("g").innerHTML=EXERCISES.map(x=>`<div>${FIG.svg(x.id,{anim:!still})}<b>${x.name}</b>${FIG.has(x.id)?"":" ⚠️"}</div>`).join("");</script></body></html>
